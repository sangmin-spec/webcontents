<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            img {
                animation: swing 1s ease-in-out infinite; 
            }
            @keyframes swing {
                0% {
                    transform: rotate(0deg);   
                }
                25% {
                    transform: rotate(-90deg);    
                
                75% {
                    transform: rotate(90deg);    
                }
                100% {
                    transform: rotate(0deg);
                }
            }
        </style>
    </head>
    <body>
        <h3>어지러워요</h3>
        <hr>
        <p><img src="media/스폰지밥.png" width="250" height="150"></p>
    </body>
</html>
