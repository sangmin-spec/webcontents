<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            img {
                animation: swing 1s ease-in-out infinite; 
            }
            @keyframes swing {
                0% {
                    transform: rotate(0deg);      /* 시작: 제자리 */
                }
                25% {
                    transform: rotate(-90deg);    /* 0.25초: 왼쪽으로 90도 */
                }
                75% {
                    transform: rotate(90deg);     /* 0.75초: 오른쪽으로 90도 */
                }
                100% {
                    transform: rotate(0deg);      /* 1초: 다시 제자리로 복귀 */
                }
            }
        </style>
    </head>
    <body>
        <h3>어지러워요</h3>
        <hr>
        <p><img src="media/스폰지밥.png" width="250" height="150"></p>
    </body>
</html>
