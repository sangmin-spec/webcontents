<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>설문지</title>
    </head>
    <body>
        <h3>설문지</h3>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
        <form>
            학년
            <input type="radio" name="grade" value="1">1학년
            <input type="radio" name="grade" value="2">2학년
            <input type="radio" name="grade" value="3">3학년
        </form>
        <br>
        <form>
            성별
            <input type="radio" name="성별" value="1">남
            <input type="radio" name="성별" value="2">여
        </form>
        <br>
        <form>
            관심분야
            <select name="interest">
                <option value="1">응용 소프트웨어</option>
                <option value="2">운영체제 소프트웨어</option>
                <option value="3">모바일 소프트웨어</option>
            </select>
        </form>
        <br>
        <form>
            진로<tab></tab>
            개발<input type="checkbox" value="1">
            기획<input type="checkbox" value="2">
            영업<input type="checkbox" value="3">
            창업<input type="checkbox" value="4">
        </form>
        <br>
        <form>
            남기고 싶은 말
        </form>
    </body>
</html>
