<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>설문지</title>
    </head>

    <body>

        <header>
            <h2>설문지</h2>
            <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
            <hr>
        </header>

        <section>
            <form>

                <p>
                    학년
                    <input type="radio" name="grade"> 1학년
                    <input type="radio" name="grade"> 2학년
                    <input type="radio" name="grade"> 3학년
                </p>

                <p>
                    성별
                    <input type="radio" name="gender"> 남
                    <input type="radio" name="gender"> 여
                </p>

                <p>
                    관심 분야
                    <select>
                        <option>정보보안</option>
                        <option>네트워크 기술</option>
                        <option>프로그래밍</option>
                    </select>
                </p>

                <p>
                    진로
                    <input type="checkbox"> 개발
                    <input type="checkbox"> 기획
                    <input type="checkbox"> 영업
                    <input type="checkbox"> 창업
                </p>

                <p>
                    남기고 싶은 말
                    <textarea rows="5" cols="40" placeholder="글을 남겨주세요"></textarea>
                </p>

            </form>
        </section>
    </body>
</html>
