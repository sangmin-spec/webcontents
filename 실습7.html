<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>animation</title>
        <style>
            img {
                transition: width 2s; 
            }
            img:hover {
                width: 100vw;
                height: auto; 
            }
        </style>
    </head>
    <body>
        <h3>어지러워요</h3>
        <hr>
        <p><img src="media/스폰지밥.png" width="250" height="150"></p>
    </body>
</html>
