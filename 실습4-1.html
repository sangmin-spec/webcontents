<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>리스트 만들기</title>
        <style>
            #menubar{
                background-color : lightgray
                width: 500px;
            }

            #menubar ul{
                margin : 0;
                padding : 0;
                width: 500px;
            }

            #menubar ul li{
                display : list-item;
                list-style-type: disc;
                padding : 0px 15px;
                list-style-position: outside;
                margin-left: 20px;
            }

            #menubar ul li a{
                text-decoration : none;
                color : black;
            }

            #menubar ul li:hover{
                background-color : yellowgreen;
            }
        </style>
    </head>

    <body>
        <h3>가보고 싶은 나라</h3>
        <hr>

        <nav id="menubar">
            <ul>
                <li><a href="#">프랑스</a></li>
                <li><a href="#">독일</a></li>
                <li><a href="#">칠레</a></li>
                <li><a href="#">남아프리카공화국</a></li>
            </ul>
        </nav>
    </body>
</html>
