<!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>오디오 재생 리스트</title>
        <style>

        .line{
            padding:8px 0;
        }
        .num{
            display:inline-block;
            width:15px;
            height:25px;
            border:1px solid green;
            text-align:center;
            line-height:25px;
        }
        .song{
            display:inline-block;
            width:250px;
            font-size : 20px;
            font-weight : bold;
            border-bottom:1px solid gray;
            margin : 0;
        }
        .button{
            display:inline-table;
            border-collapse:collapse;
        }
        button:hover{
            color:magenta;
        }

        </style>
    </head>
    <body>
        <h3>오디오 재생 리스트</h3>
        <hr>
        <div class="line">
            <span class="num">1</span>
            <h3 class="song">애국가</h3>
            <span class="button">
            <button>재생</button>
            <button>중지</button>
            </span>
        </div>
        <div class="line">
            <span class="num">2</span>
            <h3 class="song">Moon Glow</h3>
            <span class="button">
            <button>재생</button>
            <button>중지</button>
            </span>
        </div>

        <div class="line">
            <span class="num">3</span>
            <h3 class="song">Embraceable You</h3>
            <span class="button">
            <button>재생</button>
            <button>중지</button>
            </span>
        </div>
    </body>
</html>
